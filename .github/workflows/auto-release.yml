name: auto-release

# The canonical consumer shim (org ★★ AUTO-RELEASE): every merge to main
# bumps, tags, pushes and publishes. The pipeline lives once, in
# pleme-io/substrate; this file only names it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/cargo-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
